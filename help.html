    .guide-list{display:grid;gap:28px}.guide{overflow:hidden;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:0 12px 34px rgba(49,55,112,.07)}.guide[hidden]{display:none}.guide-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:28px 30px 22px}.guide-title{display:flex;gap:15px}.guide-icon{display:grid;flex:0 0 52px;height:52px;place-items:center;font-size:25px;border-radius:16px;background:linear-gradient(135deg,#eef0ff,#e3f6ff)}.guide h2{margin:2px 0 8px;font-size:27px}.guide-head p{margin:0;color:var(--muted);line-height:1.7}.open-tool{flex:0 0 auto;padding:11px 15px;color:#fff;font-weight:750;text-decoration:none;border-radius:12px;background:var(--primary)}.shot-wrap{margin:0 30px;padding:8px;border:1px solid var(--line);border-radius:17px;background:#f3f5fb}.shot{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:11px}.caption{margin:8px 5px 2px;color:var(--muted);font-size:12px;text-align:center}.guide-body{padding:26px 30px 32px}.prepare{padding:18px 20px;border-left:4px solid #58b896;border-radius:0 14px 14px 0;background:#effbf6}.prepare h3,.steps h3,.dictionary h3,.finish h3{margin:0 0 12px;font-size:18px}.prepare ul,.finish ul{margin:0;padding-left:20px;color:#485267;line-height:1.8}.steps{margin-top:26px}.step-list{display:grid;gap:12px}.step{display:grid;grid-template-columns:38px 1fr;gap:13px;padding:16px;border:1px solid var(--line);border-radius:15px}.step-no{display:grid;width:34px;height:34px;place-items:center;color:#fff;font-weight:850;border-radius:11px;background:var(--primary)}.step b{display:block;margin:2px 0 5px}.step p{margin:0;color:#596378;font-size:14px;line-height:1.75}.dictionary{margin-top:26px}.dictionary table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;font-size:14px;border:1px solid var(--line);border-radius:14px}.dictionary th,.dictionary td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}.dictionary tr:last-child td{border-bottom:0}.dictionary th{width:31%;color:#3e46a4;background:#f4f5ff}.dictionary td{color:#515b70;line-height:1.65}.finish{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:26px}.finish>div{padding:18px;border-radius:15px}.result{background:#f1faf6}.warning{background:#fff8e9}.result h3{color:var(--green)}.warning h3{color:var(--yellow)}.empty{display:none;padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:#fff}.top{display:none;position:fixed;right:18px;bottom:18px;padding:11px 14px;color:#fff;text-decoration:none;border-radius:12px;background:var(--primary);box-shadow:var(--shadow)}

  <main>
    <section class="shell hero"><div class="hero-card"><div class="eyebrow">16 款工具 · 图文分步说明</div><h1>不用懂公式，照着图片一步一步点</h1><p>先找到你要解决的问题，再按 1、2、3、4 的顺序操作。每一章都告诉你需要准备什么、按钮是什么意思、结果到哪里下载，以及遇到错误怎么办。</p><div class="rules"><div class="rule"><b>① 第一次先用示例文件</b><span>看到“下载示例”就先下载，成功一次后再换成自己的表。</span></div><div class="rule"><b>② 表头就是字段名称那一行</b><span>例如“姓名、学号、班级”所在的行，不是最上面的标题大字。</span></div><div class="rule"><b>③ 先预览，再下载</b><span>重点检查人数、未匹配、重复和黄色提醒，确认后再下载结果。</span></div></div></div></section>
    <section class="shell layout" id="directory">
      <aside class="sidebar"><h2>选择一份说明</h2><input class="search" id="search" type="search" placeholder="搜索：合并、姓名、通知……" aria-label="搜索教程"><nav class="toc" id="toc"></nav></aside>
      <div><div class="guide-list" id="guides"></div><div class="empty" id="empty">没有找到相关教程，请换一个词试试。</div></div>

  <script>
  const tools = [
    {id:'freshman-helper',file:'freshman-helper.html',icon:'👋',name:'初见 · 新生认识助手',summary:'把新生名单变成方便认识、点名和复习的卡片。',prepare:['准备一份 Excel 名单，至少要有“姓名”一列。','如果要看照片，准备清晰的人像照片，并尽量用姓名给照片命名。'],steps:[['导入名单','点击名单上传区域，选择 Excel；如果文件有多个工作表，选择真正存放学生的那一页。'],['确认姓名字段','在下拉框中选择“姓名”对应的列。系统猜错时，手动改成正确列。'],['补充照片或信息','按页面提示加入照片；同名学生要结合班级、学号等信息确认，避免照片放错人。'],['开始认识与复习','使用卡片逐个查看，或进入随机复习。先用少量名单测试，再导入全班。']],controls:[['工作表','Excel 底部的页签。请选择有学生数据的页，不要选空白说明页。'],['姓名列','存放真实姓名的那一列，是生成卡片的核心字段。'],['照片匹配','通常根据照片文件名与姓名匹配；文件名里不要加无关编号。'],['随机/复习','打乱学生顺序，检查自己是否真正记住。']],result:['看到姓名卡片正常出现，人数与 Excel 一致，即导入成功。','页面数据主要保存在当前浏览器，换电脑或清理浏览器前请保留原始名单。'],tips:['姓名为空的行不会有意义，请先删除空行。','照片属于个人信息，公开电脑使用后及时关闭页面。']},
    {id:'yunyun-memory',file:'yunyun-memory.html',icon:'🧠',name:'云云记忆',summary:'给姓名自动标注拼音，帮助点名、识记和复习。',prepare:['准备包含姓名的 Excel，第一轮建议只放一个班。','生僻字、多音字请准备人工核对，自动拼音不可能百分之百正确。'],steps:[['上传 Excel','选择名单文件和正确工作表。'],['选择姓名列','把“姓名”“学生姓名”等实际姓名字段选出来。'],['核对黄色提示','系统不确定的读音会提醒。逐个点击或编辑，不要直接跳过。'],['开始记忆或导出','确认读音后按卡片练习；需要留档时再下载结果。']],controls:[['自动拼音','根据汉字生成读音，只是辅助结果。'],['黄色/待确认','表示可能是多音字或系统没有把握，必须人工看一眼。'],['编辑拼音','直接修正某一个姓名的读音，不会修改原 Excel。'],['导出','把核对后的名单保存到下载文件夹。']],result:['总人数与原表一致、黄色待确认项处理完，即可使用。'],tips:['“行、乐、单、区”等字常有多种读音。','导出前抽查至少 5 个姓名。']},
    {id:'excel-to-vcf',file:'excel-to-vcf.html',icon:'📇',name:'Excel 联系人转 VCF',summary:'把姓名和手机号批量变成手机可导入的通讯录文件。',prepare:['Excel 至少包含姓名、手机号两列。','手机号应作为文本保存，不能丢失开头的 0 或出现科学计数法。'],steps:[['先下载示例','第一次使用先按示例整理两三条测试联系人。'],['上传联系人表','选择 Excel，并确认工作表与表头行。'],['对应字段','姓名列选姓名，电话列选手机号；班级、部门可作为备注或分组。'],['预览并导出 VCF','检查 2—3 条预览，再下载 .vcf 文件；在手机通讯录中选择“导入”。']],controls:[['姓名字段','导入手机后显示的联系人名称。'],['电话字段','联系人号码，一人多个号码时先拆成明确列。'],['分组/备注','可把班级、部门等写进联系人，便于搜索。'],['生成 VCF','生成通讯录交换文件，不会直接操作你的手机。']],result:['下载得到 .vcf 文件；用手机打开或在通讯录设置中导入。'],tips:['先用 2—3 人测试，避免一次导入大量错误联系人。','重复导入会造成手机里出现重复联系人。']},
    {id:'student-roster-cleaner',file:'student-roster-cleaner.html',icon:'🧹',name:'学生名单清洗器',summary:'统一格式，并检查空值、重复、手机号、身份证号、日期等问题。',prepare:['保留一份原始文件，不要在唯一文件上直接覆盖。','明确哪些字段必须填写，以及学号、身份证号等应满足的规则。'],steps:[['导入名单','上传 Excel，选择真正的数据工作表和表头行。'],['选快速检查或自定义规则','常见名单先用快速检查；特殊编号、长度、日期范围用自定义规则。'],['对应字段并开始检查','告诉系统哪列是姓名、学号、手机号、身份证等，再运行检查。'],['逐条看问题','先处理红色错误，再看黄色提醒；必要时回原表核实。'],['下载结果','分别保存清洗后名单和问题清单，问题清单可发给相关人员补充。']],controls:[['表头行','写着“姓名、学号、班级”的那一行。标题、说明行都不算。'],['必填','该字段不能空白，例如姓名、学号。'],['唯一/重复','同一个值不应出现两次，例如学号、身份证号。'],['格式规则','检查长度、数字、手机号、身份证、日期或自定义正则。'],['问题级别','红色通常必须修改；黄色需要人工判断。']],result:['问题数量为 0 最理想；仍有问题时，可下载问题清单继续核对。'],tips:['系统只能发现规则问题，不能判断一个“格式正确但属于别人”的身份证号。','身份证、电话属于敏感信息，处理后妥善保管文件。']},
    {id:'table-match-helper',file:'table-match-helper.html',icon:'🎯',name:'学生信息提取助手',summary:'从总表中给指定学生补齐班级、学号、联系方式等字段。',prepare:['总表：包含完整学生信息。','目标表：只包含本次需要的学生，至少有姓名、学号等可用于查找的字段。'],steps:[['分别上传两张表','先上传完整总表，再上传需要补信息的目标表，不要传反。'],['确认表头和关键字段','优先用学号/身份证等唯一字段；只有姓名时，同名学生要增加班级等辅助字段。'],['设置字段对应','“姓名”和“学生姓名”含义相同，就在映射中把它们对应起来。'],['勾选需要带回的信息','例如班级、学号、联系电话。没有勾选的字段不会加入结果。'],['执行匹配并检查','重点看未匹配、重复匹配和冲突，再下载补齐后的表。']],controls:[['总表','信息最完整、人数通常最多的基础数据库。'],['目标表/分表','本次只关心的一小部分学生名单。'],['主关键字段','首选学号等唯一值，用它确定是不是同一个人。'],['辅助关键字段','主字段不够时，再用姓名、班级等缩小范围。'],['字段映射','告诉系统两张表中叫法不同但含义相同的列。']],result:['“已匹配”人数应接近目标表人数；未匹配记录需检查空格、错别字和关键字段选择。'],tips:['姓名不是绝对唯一，遇到同名必须加第二个关键字段。','不要为了匹配而自动改姓名，先回原始数据核实。']},
    {id:'multi-table-merger',file:'multi-table-merger.html',icon:'🧩',name:'多表合并总表助手',summary:'把字段不同、关键字不同的多张表按关系合成一张总表。',prepare:['准备所有待合并表，并先判断每两张表靠什么字段关联。','在纸上写出关系，例如：A 用学号连 B，B 用姓名+班级连 C。'],steps:[['导入多张表','一次选择全部文件，并为每张表确认工作表与表头。'],['选择合并方式','结构完全一样选“直接追加”；需要横向补字段选“按关键字段合并/关系链”。'],['设置合并顺序','先从信息最完整、关键字段最稳定的表开始，再逐张连接。'],['为每一步选关键字段','A 与 B 可用学号，合并结果与 C 可另选姓名+班级，不要求所有表共用同一字段。'],['处理冲突并导出','同一字段值不一致时选择保留规则，检查未连接记录后下载。']],controls:[['直接追加','列结构相同，把多张表上下拼接，人数会增加。'],['按键合并','按同一个人横向补充新列，人数通常不会简单相加。'],['关系链','每一步可使用不同关键字段，适合 A↔B↔C。'],['合并顺序','决定哪张表先作为基础，以及后续表怎样接入。'],['字段冲突','同一人同一字段出现两个不同值，需要选择优先来源或人工核对。']],result:['先核对总人数，再看未匹配数和冲突数；全部合理后下载总表与问题报告。'],tips:['没有任何可靠关联字段的两张表不能安全自动合并。','姓名+班级比单独姓名可靠，但仍不如学号。']},
    {id:'table-splitter',file:'table-splitter.html',icon:'✂️',name:'总表拆分与批量导出',summary:'按班级、学院、状态等条件，把一张总表拆成多份。',prepare:['准备一张包含分类字段的总表，例如班级或学院。','提前检查分类名称是否统一，例如“一班”和“1班”会被当成两类。'],steps:[['上传总表','选择工作表和正确表头。'],['选择拆分字段','例如班级；每个不同值会生成一份表。'],['选择保留列','只勾选分表需要看到的字段，敏感信息不要无关分发。'],['设置空值和文件名','决定分类为空的数据放进“未分类”还是不导出，并设置文件名规则。'],['预览数量并下载','确认每类人数与总人数，再下载 Excel 或 ZIP。']],controls:[['拆分字段','决定按哪一列分组。'],['保留字段','每张分表最终包含哪些列。'],['空值处理','分类字段为空的行怎样处理。'],['ZIP 下载','把多份分表打包为一个压缩文件，便于发送。']],result:['各分表人数之和应等于参与拆分的总人数。'],tips:['拆分前先清理班级名称中的空格。','发送前打开一份分表，确认没有泄露不必要字段。']},
    {id:'template-collection-merger',file:'template-collection-merger.html',icon:'📥',name:'模板收表汇总助手',summary:'读取标准模板，批量汇总多位老师回传的同类表格。',prepare:['准备一份你最初发出的标准模板。','把所有老师回执放到同一文件夹；不要把模板本身混进回执。'],steps:[['导入标准模板','只点一次上传区域并选择模板。工具会识别标题、说明、空行和真正表头。'],['确认表头、必填和重复检查字段','例如姓名必填，学号用于检查重复。设置错了会影响后面所有回执。'],['一次选择全部回执','可以按住 Ctrl 多选，或在文件窗口中全选。文件读取期间等待按钮恢复，不要重复点击。'],['确认黄色字段映射','老师把“姓名”写成“学生姓名”时，系统会尝试对应；黄色项需要你确认。'],['点击一次汇总并下载','查看文件数、成功行数、重复和问题列表，再下载汇总表。']],controls:[['标准模板','定义最终汇总表应该有哪些字段、顺序是什么。'],['回执表','各位老师填写后发回的文件，可一次选择多份。'],['必填字段','为空就进入问题清单，但不会凭空补数据。'],['重复检查字段','常选学号或身份证号，用于发现重复上报。'],['黄色映射','字段名称不完全相同，系统猜测它们含义一致，需人工确认。']],result:['顶部文件数应等于选中的回执数量；汇总行数应等于各表有效数据行之和（扣除空行/重复后）。'],tips:['现在上传模板、上传回执和开始汇总都只需操作一次。','问题清单保留来源文件，方便找到是哪位老师的哪一行。']},
    {id:'table-diff-helper',file:'table-diff-helper.html',icon:'🔍',name:'名单版本对比助手',summary:'比较旧版和新版名单，找出新增、删除和字段变化。',prepare:['准备明确的旧版和新版文件，并从文件名上区分。','确定可唯一识别一人的字段，优先学号。'],steps:[['上传旧版和新版','顺序不要反；否则新增和删除会颠倒。'],['设置关键字段','优先学号；必要时组合姓名+班级。'],['选择需要比较的字段','例如班级、电话、状态。没勾选的列不会报告变化。'],['开始对比','分别查看新增、删除、修改和重复关键值。'],['导出差异报告','确认方向无误后下载，用于复核或留档。']],controls:[['旧版','变化发生之前的名单。'],['新版','最新收到或修改后的名单。'],['关键字段','用来确认两行代表同一个人。'],['比较字段','判断这个人的哪些信息发生了变化。'],['新增/删除','相对于旧版而言；上传顺序会影响结果。']],result:['先检查新增、删除数量是否符合预期，再逐条核对修改前后值。'],tips:['两版表里的学号格式要一致，前导 0 不能丢。','不要只靠行号比较，因为排序变化会造成误判。']},
    {id:'table-summary-helper',file:'table-summary-helper.html',icon:'📊',name:'表格分类统计助手',summary:'按班级、状态、类别快速统计人数、数量、合计和占比。',prepare:['准备一张结构整齐的明细表。','先想清楚“按什么分类”和“统计什么”，例如按班级统计人数。'],steps:[['上传明细表','确认工作表与表头行。'],['选择主分类','例如班级、学院、状态。'],['需要时选择第二分类和数值列','例如先按学院再按班级；金额合计时选择金额列。'],['设置空值与排序','决定空白是否作为一类，并选择按名称或数量排序。'],['生成统计并导出','核对总计与原始明细，再下载统计表。']],controls:[['主分类','第一层分组，例如学院。'],['第二分类','细分层级，例如班级；不需要可留空。'],['数值列','用于求和或平均；只统计人数时不用选。'],['空值计入','把未填写分类的行显示为“未填写”。'],['占比','该分类数量占总数的百分比。']],result:['所有分类人数加总应与参与统计的明细行数一致。'],tips:['金额列含“元”或文字时可能无法正常求和。','统计结果反常时先检查同一类别是否存在多余空格。']},
    {id:'grade-analysis-helper',file:'grade-analysis-helper.html',icon:'📈',name:'成绩分析助手',summary:'分析各科成绩、分数段、及格率、优秀率与班级表现。',prepare:['成绩表至少包含姓名和一门成绩。','提前确定满分、及格线、优秀线，避免套错规则。'],steps:[['上传成绩表','选择正确工作表和表头。'],['指定基本字段','选择姓名、班级；没有班级也可以做整体分析。'],['选择成绩科目','勾选要分析的语文、数学等数值列。'],['设置分数线','按本次考试标准填写满分、及格和优秀分数。'],['生成并导出','查看平均分、分数段和班级差异，再导出报告。']],controls:[['科目列','真正存放分数的列，不要选择总评文字。'],['及格线','达到该分数计为及格。'],['优秀线','达到该分数计为优秀。'],['缺考/空白','应与 0 分区分，按实际规则处理。'],['班级对比','按班级分别计算指标，不代表对教师或学生的单一评价。']],result:['重点核对有效参考人数；平均分、及格率等只对有效成绩计算。'],tips:['文字“缺考”不要直接当 0 分，除非你的制度明确如此。','分析结果用于发现问题，不建议脱离背景单独排名。']},
    {id:'material-collection-checker',file:'material-collection-checker.html',icon:'✅',name:'材料收集核对助手',summary:'把应交名单与收到的文件核对，找出未交、重复和无法识别的材料。',prepare:['准备应交人员名单，最好包含学号/工号和姓名。','统一要求文件名包含学号或姓名，例如“2026001-张三.pdf”。'],steps:[['上传应交名单','选择姓名与学号/工号字段。'],['设置识别规则','优先学号，其次姓名；同名人员一定要用编号。'],['选择收到的材料','按页面支持方式选择多文件或文件夹。'],['开始核对','查看已交、未交、重复提交和无法识别四类结果。'],['提醒并导出','复制未交提醒，或下载核对清单留档。']],controls:[['应交名单','本次所有应该提交材料的人。'],['识别字段','从文件名中寻找学号/姓名，用来对应人员。'],['已交','至少找到一份可识别材料。'],['重复提交','同一人匹配到多份文件，需要判断保留哪份。'],['无法识别','文件名没有匹配到任何人，不能直接当作未交。']],result:['已交人数 + 未交人数应等于应交人数；无法识别文件需单独人工检查。'],tips:['同名时只用姓名会误匹配，务必使用学号。','本工具核对“有没有文件”，不判断文件内容是否合格。']},
    {id:'batch-file-renamer',file:'batch-file-renamer.html',icon:'🏷️',name:'批量文件重命名助手',summary:'根据名单和规则批量生成规范文件名，并打包下载。',prepare:['先备份原文件。工具通常生成新文件包，不应替代唯一原件。','如果按名单改名，准备姓名、学号等对应表。'],steps:[['选择重命名方式','能从原文件名匹配人员就用名单模式；只需编号可用顺序模式。'],['导入名单并选择文件','名单模式下先映射姓名/学号，再选择原文件。'],['设置命名模板','使用姓名、学号、班级等变量组合，例如“{班级}-{学号}-{姓名}”。'],['检查预览','重点看未匹配、重名和同名冲突；不要直接下载。'],['下载 ZIP 和映射表','ZIP 是改名后的文件；映射表记录原名与新名，便于追溯。']],controls:[['名单模式','通过文件名中的姓名/学号找到对应人员，再生成新名。'],['顺序模式','按当前文件顺序编号，不能证明文件属于谁。'],['命名模板','新文件名规则；花括号变量会被实际值替换。'],['冲突','两个文件将得到相同新名，必须修改模板或人工确认。'],['映射表','记录“原文件名 → 新文件名”，出现问题时可回查。']],result:['预览中的未匹配和冲突均为 0 后，再下载 ZIP。'],tips:['文件扩展名会保留，不要手动把 .pdf 改成 .docx。','顺序模式前先固定排序，否则编号顺序可能不是你想要的。']},
    {id:'notice-text-generator',file:'notice-text-generator.html',icon:'📣',name:'通知文本批量生成器',summary:'根据表格字段，为每个人批量生成个性化提醒和通知文字。',prepare:['准备包含姓名、班级、事项、状态等字段的表。','先写一条你愿意亲自发送的标准通知，避免语气生硬或泄露隐私。'],steps:[['上传数据表','确认工作表、表头和需要生成通知的人员。'],['设置筛选条件','例如只给“缺少材料”的学生生成，避免给所有人误发。'],['编写通知模板','用 {姓名}、{事项} 等变量插入表格内容；固定时间地点可用全局文字。'],['生成并抽查','先看前 3 条，确认称呼、内容、标点和空字段。'],['复制或导出','按需单条复制、批量复制或导出；工具不会自动发送消息。']],controls:[['筛选条件','决定哪些行需要生成通知。'],['模板变量','花括号中的字段，例如 {姓名}，会替换为每行实际内容。'],['全局内容','所有人相同的文字，例如截止时间。'],['空字段','表格没有值时可能留下空白，生成后必须检查。'],['复制/导出','只把文字交给你；发送微信、短信或邮件仍需人工完成。']],result:['生成条数应等于筛选后人数；随机抽查至少 3 条再使用。'],tips:['不要在群里公开发送含身份证、电话等敏感信息的个性化文本。','重要通知建议人工逐条确认，避免字段错误造成误解。']},
    {id:'table-privacy-masker',file:'table-privacy-masker.html',icon:'🛡️',name:'表格隐私脱敏助手',summary:'遮挡或删除表格中的个人敏感信息，生成适合分享的安全副本。',prepare:['保留原始表格，并明确接收方真正需要哪些字段。','身份证号、手机号、银行卡号、详细地址等字段，不需要时优先删除整列。'],steps:[['上传需要分享的表','选择 Excel 或 CSV，并确认工作表和表头行。'],['查看系统建议','工具会按字段名称识别姓名、手机号、身份证、邮箱、银行卡、地址等内容。'],['逐列确认规则','选择保留原值、遮住中间、全部遮住或删除整列；开头和结尾保留位数可以调整。'],['生成并检查预览','核对人数、字段数、脱敏效果和“仍保留风险字段”提醒。'],['导出安全副本','确认预览后下载。导出文件包含脱敏数据和规则说明，不包含原始明文副本。']],controls:[['保留原值','不修改该列。敏感字段只有确实需要时才建议保留。'],['遮住中间','保留指定的开头和结尾，其余换成星号。'],['全部遮住','把有值的单元格全部显示为星号。'],['删除整列','导出结果完全不含这一字段，通常最稳妥。'],['风险字段','系统根据字段名判断可能敏感，但仍需要人工确认。']],result:['“仍保留风险字段”为 0 最理想；随机抽查姓名、手机号和身份证号后再分享。'],tips:['脱敏只能降低风险，多个字段组合后仍可能识别到个人。','表头名称特殊时系统可能识别不到，需要你手动选择处理方式。']},
    {id:'batch-document-generator',file:'batch-document-generator.html',icon:'📜',name:'批量通知单与证书生成助手',summary:'用一张 Excel 名单批量生成可打印的通知单、荣誉证书和姓名牌。',prepare:['名单至少包含姓名列；证书建议再准备奖项、事项和班级字段。','先用 2—3 条虚构数据测试版式，确认后再导入正式名单。'],steps:[['导入或直接加载示例','确认工作表、表头行和姓名字段。'],['选择输出版式','通知单为 A4 纵向；证书和姓名牌为 A4 横向。'],['编辑标题和正文','点击 {姓名}、{班级}、{奖项} 等变量插入内容，并填写落款与日期。'],['逐人检查预览','用上一人、下一人检查长姓名、长文字和未识别变量。'],['选择导出方式','合并 PDF 适合一次打印；PNG 压缩包适合分别发送或再次排版。']],controls:[['花括号变量','例如 {姓名} 会按名单每一行替换成不同内容。'],['姓名字段','决定每份文档属于谁，也是生成文件名的重要字段。'],['主题颜色','同时控制边框、标题和装饰颜色。'],['文件名规则','只影响 PNG 压缩包内的文件名，不改变正文。'],['合并 PDF','所有人的页面放在一个 PDF 中，便于连续打印。']],result:['生成份数应等于名单有效数据行数；问题数量为 0，再随机查看首、中、末三人。'],tips:['PDF 页面采用图片方式保存，因此中文字体显示稳定，但文件可能较大。','一次超过 100 份建议按班级拆分后分批生成。']}
  ];

  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toc=document.getElementById('toc'), guides=document.getElementById('guides');
  toc.innerHTML=tools.map(t=>`<a href="#${t.id}"><span>${t.icon}</span><span>${esc(t.name)}</span></a>`).join('');
  guides.innerHTML=tools.map((t,i)=>`<article class="guide" id="${t.id}" data-search="${esc([t.name,t.summary,...t.prepare,...t.steps.flat(),...t.controls.flat()].join(' '))}">
    <div class="guide-head"><div class="guide-title"><span class="guide-icon">${t.icon}</span><div><div class="eyebrow">教程 ${String(i+1).padStart(2,'0')}</div><h2>${esc(t.name)}</h2><p>${esc(t.summary)}</p></div></div><a class="open-tool" href="${t.file}">打开这个工具 →</a></div>
    <figure class="shot-wrap"><img class="shot" src="assets/guides/${t.id}.png" alt="${esc(t.name)}真实操作界面截图" loading="lazy"><figcaption class="caption">真实工具界面：页面更新后位置可能略有变化，但文字名称和操作顺序相同。</figcaption></figure>
    <div class="guide-body"><section class="prepare"><h3>开始前，先准备这些</h3><ul>${t.prepare.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
    <section class="steps"><h3>照着做：${t.steps.length} 步完成</h3><div class="step-list">${t.steps.map((s,n)=>`<div class="step"><span class="step-no">${n+1}</span><div><b>${esc(s[0])}</b><p>${esc(s[1])}</p></div></div>`).join('')}</div></section>
    <section class="dictionary"><h3>页面上的词是什么意思</h3><table><tbody>${t.controls.map(c=>`<tr><th>${esc(c[0])}</th><td>${esc(c[1])}</td></tr>`).join('')}</tbody></table></section>
    <section class="finish"><div class="result"><h3>怎样算成功</h3><ul>${t.result.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="warning"><h3>最容易出错的地方</h3><ul>${t.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section></div>
  </article>`).join('');
  const search=document.getElementById('search'), empty=document.getElementById('empty');
  search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();let count=0;document.querySelectorAll('.guide').forEach(el=>{const show=!q||el.dataset.search.toLowerCase().includes(q);el.hidden=!show;if(show)count++});empty.style.display=count?'none':'block'});
  </script>
</body>
</html>
