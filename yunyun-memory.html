<body>
  <header class="masthead">
    <a class="brand" href="#" aria-label="云云记忆首页"><span class="brand-seal">云</span><span><strong>云云记忆</strong><small>姓名拼音标注</small></span></a>
    <div class="privacy"><span></span>本地处理 · 不上传名单</div>
  </header>

  <main>
    <section class="intro">
      <div><p class="kicker">一张表，读准每一个名字</p><h1>上传学生信息表<br>自动标注姓名拼音</h1></div>
      <p class="intro-note">系统会保留原表内容，新增“姓名拼音、读音提醒、确认状态”三列。多音字和生僻字会单独提示，请在导出前人工确认。</p>
    </section>

    <section class="upload-card" id="uploadCard">
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
        <span class="upload-mark">↥</span>
        <span class="upload-copy"><strong>把学生信息表拖到这里</strong><small>或点击选择 .xlsx / .xls / .csv 文件，自动识别“姓名”列</small></span>
        <span class="choose-btn">选择表格</span>
      </label>
      <div class="file-result hidden" id="fileResult"><div><span class="file-icon">表</span><span><strong id="fileName"></strong><small id="fileMeta"></small></span></div><button id="changeFile">重新选择</button></div>
    </section>

    <section class="review-card hidden" id="reviewCard">
      <div class="review-head">
        <div><p class="section-label">标注结果</p><h2>请确认容易读错的名字</h2></div>
        <div class="metrics"><div><strong id="totalCount">0</strong><span>学生</span></div><div class="warn-metric"><strong id="pendingCount">0</strong><span>待确认</span></div></div>
      </div>
      <div class="review-toolbar">
        <label class="filter"><input type="checkbox" id="pendingOnly"> 只看待确认</label>
        <div class="toolbar-actions"><button class="ghost-btn" id="confirmAll">全部标为已确认</button><button class="export-btn" id="exportBtn">导出标注后的 Excel</button></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="row-no">行</th><th>学生姓名</th><th>姓名拼音</th><th>读音提醒</th><th>状态</th></tr></thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
      <div class="review-foot"><span>提示：点击拼音或提醒文字即可直接修改。</span><span id="saveHint">当前修改仅保留在本页面中</span></div>
    </section>

    <section class="empty-guide" id="emptyGuide">
      <div><span>01</span><strong>上传名单</strong><small>自动识别姓名列</small></div><i></i><div><span>02</span><strong>核对读音</strong><small>重点确认黄色项目</small></div><i></i><div><span>03</span><strong>导出 Excel</strong><small>原表内容完整保留</small></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const state = { rows: [], roster: [], nameKey: '', fileName: '' };
  const risky = {
    '覃':'常见读音 qín / tán，请向本人确认','单':'作姓氏常读 shàn，也可能读 dān','区':'作姓氏常读 ōu，也可能读 qū','仇':'作姓氏常读 qiú，也可能读 chóu','解':'作姓氏常读 xiè，也可能读 jiě','查':'作姓氏常读 zhā，也可能读 chá','曾':'作姓氏常读 zēng，也可能读 céng','乐':'可能读 yuè / lè','重':'可能读 chóng / zhòng','盖':'作姓氏可能读 gě / gài','尉':'可能读 wèi / yù','种':'作姓氏常读 chóng，也可能读 zhǒng','缪':'作姓氏可能读 miào / miù / móu','繁':'作姓氏常读 pó，也可能读 fán','朴':'作姓氏可能读 piáo / pǔ','折':'作姓氏可能读 shé / zhé','行':'可能读 xíng / háng','长':'可能读 cháng / zhǎng','朝':'可能读 cháo / zhāo','盛':'可能读 shèng / chéng','相':'可能读 xiāng / xiàng','柏':'可能读 bǎi / bó','燕':'可能读 yàn / yān','华':'可能读 huá / huà','宁':'可能读 níng / nìng','任':'作姓氏常读 rén，也可能读 rèn','应':'作姓氏常读 yīng，也可能读 yìng','曲':'作姓氏常读 qū，也可能读 qǔ','贾':'作姓氏常读 jiǎ，也可能读 gǔ'
  };
  const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2300)}
  function pinyinOf(name){try{return window.pinyinPro.pinyin(name,{toneType:'symbol',type:'array'}).join(' ')}catch{return name}}
  function warningOf(name,py){const notes=[...name].filter((c,i,a)=>risky[c]&&a.indexOf(c)===i).map(c=>`${c}：${risky[c]}`);if([...name].some(c=>/[\u3400-\u4dbf\uf900-\ufaff]/u.test(c)||py.includes(c)))notes.push('含生僻字或未识别字，请向本人确认');return notes.join('；')}
  function detectNameKey(row){const keys=Object.keys(row||{});return keys.find(k=>/^(姓名|学生姓名|名字|name)$/i.test(String(k).trim()))||keys.find(k=>String(k).includes('姓名'))}
  async function readFile(file){
    try{
      const data=await file.arrayBuffer();
      const book=file.name.toLowerCase().endsWith('.csv')?XLSX.read(new TextDecoder('utf-8').decode(data),{type:'string'}):XLSX.read(data);
      const rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{defval:''});
      const key=detectNameKey(rows[0]);if(!key)throw new Error('没有找到“姓名”列，请检查表头');
      state.rows=rows;state.nameKey=key;state.fileName=file.name;
      state.roster=rows.map((row,rowIndex)=>({rowIndex,name:String(row[key]??'').trim()})).filter(x=>x.name).map(x=>{const py=pinyinOf(x.name);const warning=warningOf(x.name,py);return{...x,pinyin:py,warning,confirmed:!warning}});
      if(!state.roster.length)throw new Error('“姓名”列中没有可识别的学生姓名');
      $('#fileName').textContent=file.name;$('#fileMeta').textContent=`已识别 ${state.roster.length} 位学生 · 姓名列：${key}`;
      $('#dropzone').classList.add('hidden');$('#fileResult').classList.remove('hidden');$('#reviewCard').classList.remove('hidden');$('#emptyGuide').classList.add('hidden');render();toast('拼音标注完成，请重点核对黄色项目');
    }catch(e){toast(e.message||'读取失败，请检查文件格式')}
  }
  function render(){
    const only=$('#pendingOnly').checked;const list=state.roster.filter(r=>!only||!r.confirmed);
    $('#totalCount').textContent=state.roster.length;$('#pendingCount').textContent=state.roster.filter(r=>!r.confirmed).length;
    $('#resultBody').innerHTML=list.map(r=>`<tr data-row="${r.rowIndex}"><td class="row-no">${r.rowIndex+2}</td><td class="student-name">${esc(r.name)}</td><td><input class="edit-input pinyin" aria-label="${esc(r.name)}的拼音" value="${esc(r.pinyin)}"></td><td><input class="edit-input note ${r.warning?'warning':''}" aria-label="${esc(r.name)}的读音提醒" value="${esc(r.warning)}" placeholder="无特别提醒"></td><td><button class="status-btn ${r.confirmed?'':'pending'}">${r.confirmed?'已确认':'待确认'}</button></td></tr>`).join('')||'<tr><td colspan="5" class="no-result">没有待确认的姓名</td></tr>';
  }
  $('#resultBody').addEventListener('input',e=>{const r=state.roster.find(x=>x.rowIndex===Number(e.target.closest('tr')?.dataset.row));if(!r)return;if(e.target.classList.contains('pinyin'))r.pinyin=e.target.value;if(e.target.classList.contains('note'))r.warning=e.target.value;r.confirmed=false;renderMetrics()});
  $('#resultBody').addEventListener('click',e=>{if(!e.target.classList.contains('status-btn'))return;const r=state.roster.find(x=>x.rowIndex===Number(e.target.closest('tr').dataset.row));r.confirmed=!r.confirmed;render()});
  function renderMetrics(){$('#pendingCount').textContent=state.roster.filter(r=>!r.confirmed).length}
  const drop=$('#dropzone');drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0])});
  $('#fileInput').addEventListener('change',e=>e.target.files[0]&&readFile(e.target.files[0]));
  $('#changeFile').addEventListener('click',()=>$('#fileInput').click());$('#pendingOnly').addEventListener('change',render);
  $('#confirmAll').addEventListener('click',()=>{state.roster.forEach(r=>r.confirmed=true);render();toast('已全部标记为人工确认')});
  $('#exportBtn').addEventListener('click',()=>{
    const byRow=new Map(state.roster.map(r=>[r.rowIndex,r]));const out=state.rows.map((row,i)=>{const r=byRow.get(i);return{...row,'姓名拼音':r?.pinyin||'','读音提醒（请人工确认）':r?.warning||'','确认状态':r?(r.confirmed?'已确认':'待确认'):''}});
    const sheet=XLSX.utils.json_to_sheet(out);sheet['!cols']=Object.keys(out[0]||{}).map(k=>({wch:Math.max(12,Math.min(40,k.length*2+6))}));const book=XLSX.utils.book_new();XLSX.utils.book_append_sheet(book,sheet,'拼音标注名单');const base=state.fileName.replace(/\.(xlsx|xls|csv)$/i,'');XLSX.writeFile(book,`${base}_拼音标注.xlsx`);toast('Excel 已导出');
  });
  async function registerTool(){const c=document.modelContext;if(!c?.registerTool)return;try{await c.registerTool({name:'get_pronunciation_review_summary',title:'查看姓名校音进度',description:'读取当前名单人数及待人工确认数量。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>({students:state.roster.length,pendingReview:state.roster.filter(r=>!r.confirmed).length})})}catch{}}
  registerTool();
})();
</script>
</body>
